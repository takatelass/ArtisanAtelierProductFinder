name: 商品データ自動更新

on:
  push:
    paths:
      - 'update-data/latest.csv'
      - 'update-data/smartregi.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 商品データを更新
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          csv_path = "update-data/latest.csv"
          json_path = "demo/products.json"
          smartregi_path = "update-data/smartregi.json"
          timestamp_path = "update-data/product-updated-at.json"
          smartregi_timestamp_path = "update-data/smartregi-updated-at.json"

          # 今回のpushで変更された元データを確認
          changed_paths = set()

          try:
              changed_output = os.popen(
                  "git diff --name-only HEAD^ HEAD"
              ).read()

              changed_paths = {
                  line.strip()
                  for line in changed_output.splitlines()
                  if line.strip()
              }

          except Exception:
              changed_paths = set()

          product_source_changed = (
              csv_path in changed_paths
          )

          smartregi_source_changed = (
              smartregi_path in changed_paths
          )

          print(
              f"商品CSV変更: {product_source_changed}"
          )

          print(
              f"スマレジJSON変更: {smartregi_source_changed}"
          )

          def normalize(value):
              if value is None:
                  return ""
              return str(value).strip()

          def to_bool(value):
              value = normalize(value).lower()

              return value in [
                  "true",
                  "1",
                  "yes",
                  "y",
                  "○",
                  "〇",
                  "はい"
              ]

          def to_int(value):
              value = normalize(value)

              if value == "":
                  return 0

              try:
                  return int(
                      float(
                          value.replace(",", "")
                      )
                  )
              except:
                  return 0

          def split_tags(value):
              value = normalize(value)

              if not value:
                  return []

              return [
                  item.strip()
                  for item in value.split("|")
                  if item.strip()
              ]

          def create_product(row):
              return {
                  "maker": normalize(row.get("メーカー名")),
                  "code": normalize(row.get("品番")),
                  "name": normalize(row.get("商品名")),
                  "price": to_int(row.get("価格")),
                  "brand": normalize(row.get("ブランド")),
                  "category": normalize(row.get("カテゴリ")),
                  "subCategory": normalize(row.get("サブカテゴリ")),
                  "series": normalize(row.get("シリーズ")),

                  "color": normalize(row.get("色")),
                  "colorGroup": normalize(row.get("カラー系統")),

                  "material": normalize(row.get("素材")),
                  "size": normalize(row.get("サイズ")),
                  "weight": normalize(row.get("重量")),

                  "title": normalize(row.get("商品タイトル")),
                  "image": normalize(row.get("商品画像URL")),
                  "url": normalize(row.get("商品URL")),

                  "tags": split_tags(
                      row.get("特徴タグ")
                  ),

                  "usageTags": split_tags(
                      row.get("用途タグ")
                  ),

                  "spec1": normalize(
                      row.get("スペック①")
                  ),

                  "spec2": normalize(
                      row.get("スペック②")
                  ),

                  "spec3": normalize(
                      row.get("スペック③")
                  ),

                  "spec4": normalize(
                      row.get("スペック④")
                  ),

                  "spec5": normalize(
                      row.get("スペック⑤")
                  ),

                  "care": normalize(
                      row.get("ケア方法")
                  ),

                  "note1": normalize(
                      row.get("備考①")
                  ),

                  "note2": normalize(
                      row.get("備考②")
                  ),

                  "recommended": to_bool(
                      row.get("おすすめ")
                  ),

                  "isNew": to_bool(
                      row.get("新商品")
                  ),

                  "popular": to_bool(
                      row.get("人気")
                  ),

                  "published": to_bool(
                      row.get("公開")
                  ),

                  "stock": normalize(
                      row.get("店舗在庫")
                  )
              }

          # --------------------------------------------------
          # 現在の商品データを読み込み
          # --------------------------------------------------

          with open(
              json_path,
              "r",
              encoding="utf-8"
          ) as f:
              current_products = json.load(f)

          print(
              f"現在の商品数: {len(current_products)}"
          )

          # --------------------------------------------------
          # 商品CSVが存在する場合は商品データを更新
          # --------------------------------------------------

          if os.path.exists(csv_path):

              with open(
                  csv_path,
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:

                  reader = csv.DictReader(f)
                  rows = list(reader)

              new_products = [
                  create_product(row)
                  for row in rows
              ]

              current_map = {
                  normalize(
                      product.get("code")
                  ): product
                  for product in current_products
              }

              new_map = {
                  normalize(
                      product.get("code")
                  ): product
                  for product in new_products
              }

              current_codes = set(
                  current_map.keys()
              )

              new_codes = set(
                  new_map.keys()
              )

              added_codes = (
                  new_codes -
                  current_codes
              )

              deleted_codes = (
                  current_codes -
                  new_codes
              )

              changed_codes = set()

              for code in (
                  current_codes &
                  new_codes
              ):

                  if (
                      current_map[code] !=
                      new_map[code]
                  ):
                      changed_codes.add(code)

              print(
                  f"CSVの商品数: {len(new_products)}"
              )

              print(
                  f"追加: {len(added_codes)}件"
              )

              print(
                  f"変更: {len(changed_codes)}件"
              )

              print(
                  f"削除候補: {len(deleted_codes)}件"
              )

              if deleted_codes:

                  print(
                      "削除候補の商品があります。"
                  )

                  print(
                      "安全のため更新を中止します。"
                  )

                  for code in sorted(
                      deleted_codes
                  ):

                      print(
                          f"削除候補: {code}"
                      )

                  raise SystemExit(1)

              current_products = new_products

              print(
                  "商品CSVから商品データを更新しました。"
              )

          else:

              print(
                  "商品CSVはありません。"
              )

              print(
                  "現在の商品データをそのまま使用します。"
              )

          # --------------------------------------------------
          # スマレジ在庫データを読み込み
          # --------------------------------------------------

          if os.path.exists(smartregi_path):

              with open(
                  smartregi_path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  smartregi_data = json.load(f)

              # 更新ページで作成したJSONは
              # { updatedAt, products } 形式。
              # 以前のJSONは配列形式なので両方に対応する。
              if isinstance(smartregi_data, dict):

                  smartregi_products = smartregi_data.get(
                      "products",
                      []
                  )

                  embedded_smartregi_updated_at = (
                      normalize(
                          smartregi_data.get(
                              "updatedAt"
                          )
                      )
                  )

              else:

                  smartregi_products = smartregi_data
                  embedded_smartregi_updated_at = ""

              smartregi_map = {
                  normalize(
                      product.get("code")
                  ): product
                  for product in smartregi_products
              }

              matched_products = 0
              unmatched_products = 0

              for product in current_products:

                  code = normalize(
                      product.get("code")
                  )

                  smartregi_product = (
                      smartregi_map.get(code)
                  )

                  if smartregi_product:

                      smartregi_stock = (
                          smartregi_product.get(
                              "smartRegiStock",
                              []
                          )
                      )

                      product["smartRegiStock"] = (
                          smartregi_stock
                      )

                      matched_products += 1

                  else:

                      product["smartRegiStock"] = []

                      unmatched_products += 1

              print(
                  f"スマレジ商品コード一致: {matched_products}件"
              )

              print(
                  f"スマレジ商品コード不一致: {unmatched_products}件"
              )

              print(
                  "スマレジ在庫データを商品データへ反映しました。"
              )

          else:

              print(
                  "smartregi.jsonがありません。"
              )

              print(
                  "スマレジ在庫データの反映は行いません。"
              )

          # --------------------------------------------------
          # products.jsonを書き込み
          # --------------------------------------------------

          with open(
              json_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  current_products,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "demo/products.jsonを保存しました。"
          )

          # --------------------------------------------------
          # 更新日時を保存
          # --------------------------------------------------

          now_jst = datetime.now(
              ZoneInfo("Asia/Tokyo")
          )

          now_string = now_jst.strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          # 商品CSVが更新されたときだけ商品データ更新日時を更新
          if product_source_changed:

              product_timestamp_data = {
                  "updatedAt": now_string
              }

              with open(
                  timestamp_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      product_timestamp_data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  f"商品データ最終更新日時: {now_string}"
              )

          else:

              print(
                  "商品CSVの変更はないため、商品データ更新日時は維持します。"
              )

          # スマレジJSONが更新されたときだけ
          # スマレジ在庫更新日時を更新
          if smartregi_source_changed:

              smartregi_updated_at = (
                  embedded_smartregi_updated_at
                  or now_string
              )

              smartregi_timestamp_data = {
                  "updatedAt": smartregi_updated_at
              }

              with open(
                  smartregi_timestamp_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      smartregi_timestamp_data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  f"スマレジ在庫最終更新日時: {smartregi_updated_at}"
              )

          else:

              print(
                  "スマレジJSONの変更はないため、スマレジ在庫更新日時は維持します。"
              )

          PY

      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demo/products.json
          git add update-data/product-updated-at.json
          git add update-data/smartregi-updated-at.json

          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "商品データとスマレジ在庫を自動更新"
            git push
          fi