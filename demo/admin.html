<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artisan Atelier Product Finder - 管理画面</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f7f7f7;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .description {
            margin: 0 0 30px;
            color: #666;
            font-size: 14px;
        }

        .admin-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            margin: 0 0 16px;
            font-size: 17px;
            font-weight: 600;
        }

        .file-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        .button {
            margin-top: 16px;
            padding: 12px 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f3f3f3;
            font-size: 14px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <h1>Artisan Atelier Product Finder</h1>

        <p class="description">
            商品データ更新用 管理ページ
        </p>

        <section class="admin-card">

            <h2>商品データCSV</h2>

            <input
                type="file"
                id="csvFile"
                class="file-input"
                accept=".csv,text/csv">

            <button
                type="button"
                id="loadCsvButton"
                class="button">
                CSVを読み込む
            </button>

            <div
                id="status"
                class="status hidden">
            </div>

            <div class="warning">
                ※ 現在はCSVの読み込み・内容確認までの管理画面です。<br>
                GitHub上の商品データを直接変更する機能は、この後の工程で追加します。
            </div>

        </section>

    </main>

    <script>

        const csvFile =
            document.getElementById(
                'csvFile'
            );

        const loadCsvButton =
            document.getElementById(
                'loadCsvButton'
            );

        const status =
            document.getElementById(
                'status'
            );

        loadCsvButton.addEventListener(
            'click',
            () => {

                const file =
                    csvFile.files[0];

                if (!file) {

                    status.classList.remove(
                        'hidden'
                    );

                    status.textContent =
                        'CSVファイルを選択してください。';

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload =
                    (event) => {

                        const text =
                            event.target.result;

                        const lines =
                            text
                                .split(/\r?\n/)
                                .filter(
                                    line =>
                                        line.trim()
                                );

                        status.classList.remove(
                            'hidden'
                        );

                        status.innerHTML =
                            `CSVを読み込みました。<br>
                            ファイル名：${file.name}<br>
                            行数：約${lines.length}行`;
                    };

                reader.onerror =
                    () => {

                        status.classList.remove(
                            'hidden'
                        );

                        status.textContent =
                            'CSVファイルの読み込みに失敗しました。';
                    };

                reader.readAsText(
                    file,
                    'UTF-8'
                );
            }
        );

    </script>

</body>

</html>
