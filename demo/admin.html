<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artisan Atelier Product Finder - 管理画面</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f7f7f7;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .description {
            margin: 0 0 30px;
            color: #666;
            font-size: 14px;
        }

        .admin-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            margin: 0 0 16px;
            font-size: 17px;
            font-weight: 600;
        }

        .file-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        .button {
            margin-top: 16px;
            padding: 12px 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f3f3f3;
            font-size: 14px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <h1>Artisan Atelier Product Finder</h1>

        <p class="description">
            商品データ更新用 管理ページ
        </p>

        <section class="admin-card">

            <h2>商品データCSV</h2>

            <input
                type="file"
                id="csvFile"
                class="file-input"
                accept=".csv,text/csv">

            <button
                type="button"
                id="loadCsvButton"
                class="button">
                CSVを読み込む
            </button>

            <div
                id="status"
                class="status hidden">
            </div>

            <div class="warning">
                ※ 現在はCSVの読み込み・内容確認までの管理画面です。<br>
                GitHub上の商品データを直接変更する機能は、この後の工程で追加します。
            </div>

        </section>

    </main>

<script>

    const csvFile =
        document.getElementById(
            'csvFile'
        );

    const loadCsvButton =
        document.getElementById(
            'loadCsvButton'
        );

    const status =
        document.getElementById(
            'status'
        );


    /*
     * CSV読み込み
     */
    loadCsvButton.addEventListener(
        'click',
        () => {

            const file =
                csvFile.files[0];

            if (!file) {

                status.classList.remove(
                    'hidden'
                );

                status.textContent =
                    'CSVファイルを選択してください。';

                return;
            }

            const reader =
                new FileReader();


            reader.onload =
                (event) => {

                    const text =
                        event.target.result;

                    const lines =
                        text
                            .split(/\r?\n/)
                            .filter(
                                line =>
                                    line.trim()
                            );

                    if (
                        lines.length < 2
                    ) {

                        status.classList.remove(
                            'hidden'
                        );

                        status.textContent =
                            'CSVに商品データがありません。';

                        return;
                    }


                    /*
                     * CSVを配列化
                     */
                    const rows =
                        parseCsv(
                            text
                        );


                    if (
                        rows.length < 2
                    ) {

                        status.classList.remove(
                            'hidden'
                        );

                        status.textContent =
                            'CSVデータを正しく読み込めませんでした。';

                        return;
                    }


                    const headers =
                        rows[0];


                    /*
                     * 必須項目
                     */
                    const requiredFields = [
                        'メーカー名',
                        '品番',
                        '商品名',
                        '価格',
                        '商品タイトル',
                        'スペック①',
                        'スペック②',
                        'スペック③',
                        'スペック④',
                        'スペック⑤',
                        'ケア方法'
                    ];


                    const missingFields =
                        requiredFields.filter(
                            field =>
                                !headers.includes(
                                    field
                                )
                        );


                    status.classList.remove(
                        'hidden'
                    );


                    if (
                        missingFields.length > 0
                    ) {

                        status.innerHTML =
                            `
                            <strong>
                            ⚠ 必須項目が見つかりません
                            </strong>
                            <br><br>
                            ${missingFields.join(
                                ' / '
                            )}
                            `;

                        return;
                    }


                    /*
                     * CSV → JSON変換
                     */
                    const products =
                        rows
                            .slice(1)
                            .map(
                                row =>
                                    convertRowToProduct(
                                        headers,
                                        row
                                    )
                            )
                            .filter(
                                product =>
                                    product.code
                            );


                    /*
                     * 結果表示
                     */
                    status.innerHTML =
                        `
                        <strong>
                        ✓ 商品データを変換しました
                        </strong>
                        <br><br>

                        商品件数：
                        ${products.length}件
                        <br>

                        CSV項目数：
                        ${headers.length}項目
                        <br><br>

                        <button
                            type="button"
                            id="downloadJsonButton"
                            class="button">
                            products.jsonをダウンロード
                        </button>
                        `;


                    /*
                     * JSONダウンロード
                     */
                    document
                        .getElementById(
                            'downloadJsonButton'
                        )
                        .addEventListener(
                            'click',
                            () => {

                                downloadJson(
                                    products
                                );
                            }
                        );
                };


            reader.onerror =
                () => {

                    status.classList.remove(
                        'hidden'
                    );

                    status.textContent =
                        'CSVファイルの読み込みに失敗しました。';
                };


            reader.readAsText(
                file,
                'UTF-8'
            );
        }
    );


    /*
     * CSV全体を読み込む
     */
    function parseCsv(text) {

        const rows = [];

        let row = [];

        let value = '';

        let insideQuotes =
            false;


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            const char =
                text[i];

            const nextChar =
                text[i + 1];


            if (
                char === '"' &&
                insideQuotes &&
                nextChar === '"'
            ) {

                value += '"';

                i++;

                continue;
            }


            if (
                char === '"'
            ) {

                insideQuotes =
                    !insideQuotes;

                continue;
            }


            if (
                char === ',' &&
                !insideQuotes
            ) {

                row.push(
                    value.trim()
                );

                value = '';

                continue;
            }


            if (
                (
                    char === '\n' ||
                    char === '\r'
                ) &&
                !insideQuotes
            ) {

                if (
                    char === '\r' &&
                    nextChar === '\n'
                ) {

                    i++;
                }

                row.push(
                    value.trim()
                );

                value = '';


                if (
                    row.some(
                        cell =>
                            cell !== ''
                    )
                ) {

                    rows.push(
                        row
                    );
                }

                row = [];

                continue;
            }


            value += char;
        }


        /*
         * 最後の行
         */
        if (
            value !== '' ||
            row.length > 0
        ) {

            row.push(
                value.trim()
            );

            rows.push(
                row
            );
        }


        return rows;
    }


    /*
     * CSV 1行 → Product JSON
     */
    function convertRowToProduct(
        headers,
        row
    ) {

        const data = {};


        headers.forEach(
            (header, index) => {

                data[header] =
                    row[index] || '';
            }
        );


        return {

            maker:
                data['メーカー名'],

            code:
                data['品番'],

            name:
                data['商品名'],

            price:
                Number(
                    String(
                        data['価格']
                    )
                        .replace(
                            /,/g,
                            ''
                        )
                        .replace(
                            /円/g,
                            ''
                        )
                        .trim()
                ) || 0,

            brand:
                data['ブランド'],

            category:
                data['カテゴリ'],

            subCategory:
                data['サブカテゴリ'],

            series:
                splitValues(
                    data['シリーズ']
                ),

            color:
                splitValues(
                    data['色']
                ),

            colorGroup:
                splitValues(
                    data['カラー系統']
                ),

            material:
                splitValues(
                    data['素材']
                ),

            size:
                data['サイズ'],

            weight:
                data['重量'],

            title:
                data['商品タイトル'],

            spec1:
                data['スペック①'],

            spec2:
                data['スペック②'],

            spec3:
                data['スペック③'],

            spec4:
                data['スペック④'],

            spec5:
                data['スペック⑤'],

            care:
                data['ケア方法'],

            image:
                data['商品画像URL'],

            url:
                data['商品URL'],

            tags:
                splitValues(
                    data['特徴タグ']
                ),

            usageTags:
                splitValues(
                    data['用途タグ']
                ),

            recommended:
                toBoolean(
                    data['おすすめ']
                ),

            isNew:
                toBoolean(
                    data['新商品']
                ),

            popular:
                toBoolean(
                    data['人気商品']
                ),

            maleRecommended:
                toBoolean(
                    data['男性おすすめ']
                ),

            femaleRecommended:
                toBoolean(
                    data['女性おすすめ']
                ),

            stock:
                data['店舗在庫'],

            published:
                toBoolean(
                    data['公開']
                )
        };
    }


    /*
     * | 区切りの項目を配列化
     */
    function splitValues(value) {

        if (!value) {
            return [];
        }

        return String(value)
            .split('|')
            .map(
                item =>
                    item.trim()
            )
            .filter(Boolean);
    }


    /*
     * TRUE / FALSE をboolean化
     */
    function toBoolean(value) {

        const normalized =
            String(
                value || ''
            )
                .trim()
                .toUpperCase();

        return (
            normalized === 'TRUE' ||
            normalized === '○' ||
            normalized === '〇' ||
            normalized === '1'
        );
    }


    /*
     * JSONダウンロード
     */
    function downloadJson(
        products
    ) {

        const json =
            JSON.stringify(
                products,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        'application/json'
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                'a'
            );

        link.href = url;

        link.download =
            'products.json';

        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );

        URL.revokeObjectURL(
            url
        );
    }

</script>

</body>

</html>
