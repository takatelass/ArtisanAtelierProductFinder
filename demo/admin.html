<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artisan Atelier Product Finder - 管理画面</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f7f7f7;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .description {
            margin: 0 0 30px;
            color: #666;
            font-size: 14px;
        }

        .admin-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            margin: 0 0 16px;
            font-size: 17px;
            font-weight: 600;
        }

        .file-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        .button {
            margin-top: 16px;
            padding: 12px 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f3f3f3;
            font-size: 14px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <h1>Artisan Atelier Product Finder</h1>

        <p class="description">
            商品データ更新用 管理ページ
        </p>

        <section class="admin-card">

            <h2>商品データCSV</h2>

            <input
                type="file"
                id="csvFile"
                class="file-input"
                accept=".csv,text/csv">

            <button
                type="button"
                id="loadCsvButton"
                class="button">
                CSVを読み込む
            </button>

            <div
                id="status"
                class="status hidden">
            </div>

            <div class="warning">
                ※ 現在はCSVの読み込み・内容確認までの管理画面です。<br>
                GitHub上の商品データを直接変更する機能は、この後の工程で追加します。
            </div>

        </section>

    </main>

<script>

    const csvFile =
        document.getElementById(
            'csvFile'
        );

    const loadCsvButton =
        document.getElementById(
            'loadCsvButton'
        );

    const status =
        document.getElementById(
            'status'
        );

    loadCsvButton.addEventListener(
        'click',
        () => {

            const file =
                csvFile.files[0];

            if (!file) {

                status.classList.remove(
                    'hidden'
                );

                status.textContent =
                    'CSVファイルを選択してください。';

                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                (event) => {

                    const text =
                        event.target.result;

                    const lines =
                        text
                            .split(/\r?\n/)
                            .filter(
                                line =>
                                    line.trim()
                            );

                    if (lines.length === 0) {

                        status.classList.remove(
                            'hidden'
                        );

                        status.textContent =
                            'CSVにデータがありません。';

                        return;
                    }

                    /*
                     * 1行目を項目名として取得
                     */
                    const headers =
                        parseCsvLine(
                            lines[0]
                        );

                    /*
                     * 商品データ件数
                     */
                    const productCount =
                        Math.max(
                            lines.length - 1,
                            0
                        );

                    /*
                     * 必須項目
                     */
                    const requiredFields = [
                      'メーカー名',
                      '品番',
                      '商品名',
                      '価格',
                      '商品タイトル',
                      'スペック①',
                      'スペック②',
                      'スペック③',
                      'スペック④',
                      'スペック⑤',
                      'ケア方法'
                    ];

                    const missingFields =
                        requiredFields.filter(
                            field =>
                                !headers.includes(
                                    field
                                )
                        );

                    status.classList.remove(
                        'hidden'
                    );

                    let message =
                        `
                        <strong>CSVを読み込みました。</strong><br><br>

                        ファイル名：
                        ${file.name}<br>

                        商品件数：
                        ${productCount}件<br>

                        項目数：
                        ${headers.length}項目<br><br>

                        <strong>項目一覧</strong><br>
                        ${headers.join(' / ')}
                        `;

                    if (
                        missingFields.length > 0
                    ) {

                        message += `
                            <br><br>
                            <strong>
                            ⚠ 必須項目が見つかりません
                            </strong><br>
                            ${missingFields.join(
                                ' / '
                            )}
                        `;

                    } else {

                        message += `
                            <br><br>
                            <strong>
                            ✓ 必須項目を確認しました
                            </strong>
                        `;
                    }

                    status.innerHTML =
                        message;
                };

            reader.onerror =
                () => {

                    status.classList.remove(
                        'hidden'
                    );

                    status.textContent =
                        'CSVファイルの読み込みに失敗しました。';
                };

            reader.readAsText(
                file,
                'UTF-8'
            );
        }
    );


    /*
     * CSV 1行を分解する
     * 「,」を含む項目や
     * ダブルクォーテーションにも対応
     */
    function parseCsvLine(line) {

        const result = [];

        let current = '';

        let insideQuotes = false;

        for (
            let i = 0;
            i < line.length;
            i++
        ) {

            const char =
                line[i];

            const nextChar =
                line[i + 1];

            if (
                char === '"' &&
                insideQuotes &&
                nextChar === '"'
            ) {

                current += '"';

                i++;

            } else if (
                char === '"'
            ) {

                insideQuotes =
                    !insideQuotes;

            } else if (
                char === ',' &&
                !insideQuotes
            ) {

                result.push(
                    current.trim()
                );

                current = '';

            } else {

                current += char;
            }
        }

        result.push(
            current.trim()
        );

        return result;
    }

</script>

</body>

</html>
