/* ==========================================================
   商品データ最終更新日時
========================================================== */

async function loadProductUpdatedAt() {

    const element =
        document.getElementById(
            'productUpdatedAt'
        );

    if (!element) {
        return;
    }

    try {

        const response =
            await fetch(
                'update-data/product-updated-at.json?t=' +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                '更新日時ファイルを読み込めませんでした。'
            );
        }

        const data =
            await response.json();

        if (data.updatedAt) {

            element.textContent =
                data.updatedAt;

        } else {

            element.textContent =
                '未記録';

        }

    } catch (error) {

        element.textContent =
            '取得できませんでした';

        console.error(error);

    }

}

/* ==========================================================
   CSV解析
========================================================== */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {

            if (inQuotes && next === '"') {
                value += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }

        } else if (char === ',' && !inQuotes) {

            row.push(value);
            value = '';

        } else if (
            (char === '\n' || char === '\r') &&
            !inQuotes
        ) {

            if (char === '\r' && next === '\n') {
                i++;
            }

            row.push(value);
            rows.push(row);

            row = [];
            value = '';

        } else {

            value += char;

        }
    }

    if (value !== '' || row.length > 0) {
        row.push(value);
        rows.push(row);
    }

    if (rows.length === 0) {
        return [];
    }


    const headers =
        rows[0].map(header =>
            header
                .replace(/^\uFEFF/, '')
                .trim()
        );


    return rows
        .slice(1)
        .filter(row =>
            row.some(value =>
                value.trim() !== ''
            )
        )
        .map(row => {

            const product = {};

            headers.forEach(
                (header, index) => {
                    product[header] =
                        row[index] ?? '';
                }
            );

            return product;

        });

}


/* ==========================================================
   配列・文字列の比較用
========================================================== */

function normalizeValue(value) {

    if (Array.isArray(value)) {
        return value.join('|');
    }

    if (value === null || value === undefined) {
        return '';
    }

    return String(value)
        .trim();

}


/* ==========================================================
   CSV → Product Finderデータ比較用
========================================================== */

function getCSVValue(product, names) {

    for (const name of names) {

        if (
            Object.prototype.hasOwnProperty.call(
                product,
                name
            )
        ) {
            return product[name];
        }

    }

    return '';

}


function createComparisonKey(product) {

}

/* ==========================================================
   更新用データ補助関数
========================================================== */

function normalizePrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return 0;
    }

    const normalized =
        String(value)
            .replace(/,/g, '')
            .replace(/円/g, '')
            .trim();

    const number =
        Number(normalized);

    return Number.isNaN(number)
        ? 0
        : number;

}


function splitCSVTags(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {
        return [];
    }

    return String(value)
        .split('|')
        .map(tag => tag.trim())
        .filter(Boolean);

}


function normalizeBoolean(value) {

    if (
        value === true ||
        value === 'true' ||
        value === 'TRUE' ||
        value === '1' ||
        value === 'はい' ||
        value === '○'
    ) {
        return true;
    }

    return false;

}

/* ==========================================================
   商品データの変更判定
========================================================== */

function normalizeComparisonValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    /*
     * 配列の場合
     * JSONのタグ配列を
     * 「|」区切りの文字列へ統一
     */
    if (Array.isArray(value)) {

        return value
            .map(item =>
                String(item).trim()
            )
            .filter(Boolean)
            .join('|');

    }


    let normalized =
        String(value)
            .trim();


    /*
     * True / False を統一
     */
    if (
        normalized.toLowerCase() === 'true'
    ) {
        return 'true';
    }


    if (
        normalized.toLowerCase() === 'false'
    ) {
        return 'false';
    }


    /*
     * 数値のカンマを除去
     */
    normalized =
        normalized.replace(/,/g, '');


    /*
     * 数値として扱えるものは統一
     */
    if (
        normalized !== '' &&
        !isNaN(normalized)
    ) {

        return String(
            Number(normalized)
        );

    }


    /*
     * 「|」区切りデータを正規化
     *
     * 例：
     * 牛革|軽量|ボトル収納|
     *
     * ↓
     *
     * 牛革|軽量|ボトル収納
     */
    if (
        normalized.includes('|')
    ) {

        return normalized
            .split('|')
            .map(item =>
                item.trim()
            )
            .filter(Boolean)
            .join('|');

    }

    /*
 * 空欄を意味する記号を統一
 */
if (
    normalized === '-' ||
    normalized === '—' ||
    normalized === 'ー'
) {
    return '';
}

    return normalized;

}

function getExistingCSVField(
    csv,
    names
) {

    for (const name of names) {

            Object.prototype.hasOwnProperty.call(
                csv,

        ) {
            return {
                exists: true,
                value: csv[name]
            };
        }

    }

    return {
        exists: false,
        value: ''
    };

}

    currentValue,
    csvValue
) {

    const current =

    const csv =

    return current === csv;

}

            };

    };

/* ==========================================================
   更新用JSON生成
========================================================== */

function createUpdatedProducts() {

    if (
        currentProductsForUpdate.length === 0 ||
        csvProductsForUpdate.length === 0
    ) {

        throw new Error(
            '更新用の商品データが準備されていません。'
        );

    }


    /*
     * 現在の商品データを品番で管理
     */
    const currentMap =
        new Map(
            currentProductsForUpdate.map(
                product => [
                    String(product.code).trim(),
                    product
                ]
            )
        );


    /*
     * CSVの商品データを順番に処理
     */
    const updatedProducts =
        csvProductsForUpdate.map(
            csvProduct => {

                const code =
                    String(
                        csvProduct['品番'] || ''
                    ).trim();


                const currentProduct =
                    currentMap.get(code);


                /*
                 * 既存商品がない場合
                 * → CSVから新商品として作成
                 */
                if (!currentProduct) {

                    return convertCSVProductToJSON(
                        csvProduct
                    );

                }


                /*
                 * 既存商品がある場合
                 * → CSVの内容で更新
                 */
                return mergeCSVProduct(
                    currentProduct,
                    csvProduct
                );

            }
        );


    return updatedProducts;

}

/* ==========================================================
   スマレジCSV解析
   スマレジCSVはCP932（Shift-JIS系）で出力されるため
   TextDecoderでshift-jisとして読み込む。
========================================================== */

function parseSmartRegiCSV(text) {

    const rows = [];
    let row = [];
    let value = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {

            if (inQuotes && next === '"') {
                value += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }

        } else if (char === ',' && !inQuotes) {

            row.push(value);
            value = '';

        } else if (
            (char === '\n' || char === '\r') &&
            !inQuotes
        ) {

            if (char === '\r' && next === '\n') {
                i++;
            }

            row.push(value);
            rows.push(row);

            row = [];
            value = '';

        } else {

            value += char;

        }
    }

    if (value !== '' || row.length > 0) {
        row.push(value);
        rows.push(row);
    }

    if (rows.length === 0) {
        return [];
    }

    const headers =
        rows[0].map(header =>
            header
                .replace(/^\uFEFF/, '')
                .trim()
        );

    return rows
        .slice(1)
        .filter(row =>
            row.some(value =>
                String(value).trim() !== ''
            )
        )
        .map(row => {

            const item = {};

            headers.forEach(
                (header, index) => {
                    item[header] =
                        row[index] ?? '';
                }
            );

            return item;

        });

}


/* ==========================================================
   スマレジ照合用の正規化
========================================================== */

function normalizeSmartRegiValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    return String(value)
        .replace(/\u3000/g, ' ')
        .trim();

}


/* ==========================================================
   商品の色一覧を取得
========================================================== */

function getProductColorListForStock(product) {

    const value =
        product.color;

    if (Array.isArray(value)) {

        return value
            .flatMap(item =>
                String(item).split('|')
            )
            .map(item =>
                normalizeSmartRegiValue(item)
            )
            .filter(Boolean);

    }

    return String(value || '')
        .split('|')
        .map(item =>
            normalizeSmartRegiValue(item)
        )
        .filter(Boolean);

}


/* ==========================================================
   スマレジ在庫データ作成
========================================================== */

function createSmartRegiMatchData(
    products,
    smartRegiRows
) {

    const stockMap =
        new Map();

    let duplicateCount = 0;

    smartRegiRows.forEach(row => {

        const code =
            normalizeSmartRegiValue(
                row['品番']
            );

        const color =
            normalizeSmartRegiValue(
                row['カラー']
            );

        const quantityText =
            normalizeSmartRegiValue(
                row['在庫数']
            );

        if (!code || !color) {
            return;
        }

        const quantity =
            Number(
                quantityText.replace(/,/g, '')
            );

        const key =
            `${code}__${color}`;

        if (stockMap.has(key)) {
            duplicateCount++;
        }

        stockMap.set(
            key,
            Number.isFinite(quantity)
                ? quantity
                : 0
        );

    });


    let matchedColorCount = 0;
    let unmatchedColorCount = 0;
    let unmatchedProductCount = 0;
    let matchedProductCount = 0;

    const result =
        products.map(product => {

            const code =
                normalizeSmartRegiValue(
                    product.code
                );

            const colors =
                getProductColorListForStock(
                    product
                );

            const smartRegiStock =
                colors.map(color => {

                    const key =
                        `${code}__${color}`;

                    if (
                        stockMap.has(key)
                    ) {

                        matchedColorCount++;

                        return {
                            color,
                            quantity:
                                stockMap.get(key),
                            status:
                                'matched'
                        };

                    }

                    unmatchedColorCount++;

                    return {
                        color,
                        quantity: null,
                        status:
                            'unavailable'
                    };

                });

            if (
                smartRegiStock.length > 0 &&
                smartRegiStock.some(
                    item =>
                        item.status === 'matched'
                )
            ) {
                matchedProductCount++;
            }

            if (
                smartRegiStock.length > 0 &&
                smartRegiStock.every(
                    item =>
                        item.status === 'unavailable'
                )
            ) {
                unmatchedProductCount++;
            }

            return {
                ...product,
                smartRegiStock
            };

        });


    return {
        products: result,
        matchedColorCount,
        unmatchedColorCount,
        matchedProductCount,
        unmatchedProductCount,
        duplicateCount
    };

}

    smartRegiCsvInput.addEventListener(
        'change',
        async (event) => {

            const file =
                event.target.files &&
                event.target.files[0];

            if (!file) {
                return;
            }

            if (smartRegiFileName) {
                smartRegiFileName.textContent =
                    `選択中：${file.name}`;
            }

            smartRegiResult.textContent =
                '現在の商品データを確認しています……';

            if (smartRegiGenerateButton) {
                smartRegiGenerateButton.style.display =
                    'none';
            }

            try {

                const response =
                    await fetch('products.json');

                if (!response.ok) {
                    throw new Error(
                        'products.jsonの読み込みに失敗しました。'
                    );
                }

                const currentProducts =
                    await response.json();

                smartRegiProductsForUpdate =
                    currentProducts;

                smartRegiResult.textContent =
                    'スマレジCSVを読み込んでいます……';

                const buffer =
                    await file.arrayBuffer();

                let text;

                try {

                    text =
                        new TextDecoder(
                            'shift-jis'
                        ).decode(buffer);

                } catch (error) {

                    text =
                        new TextDecoder(
                            'utf-8'
                        ).decode(buffer);

                }

                const smartRegiRows =
                    parseSmartRegiCSV(text);

                if (
                    smartRegiRows.length === 0
                ) {
                    throw new Error(
                        'スマレジCSVにデータがありません。'
                    );
                }

                const requiredHeaders = [
                    '品番',
                    'カラー',
                    '在庫数'
                ];

                const missingHeaders =
                    requiredHeaders.filter(
                        header =>
                            !(
                                Object.prototype
                                    .hasOwnProperty.call(
                                        smartRegiRows[0],
                                        header
                                    )
                            )
                    );

                if (
                    missingHeaders.length > 0
                ) {
                    throw new Error(
                        `必要な列が見つかりません：${missingHeaders.join('、')}`
                    );
                }

                const result =
                    createSmartRegiMatchData(
                        currentProducts,
                        smartRegiRows
                    );

                smartRegiMatchData =
                    result.products;

                showSmartRegiResult(
                    smartRegiRows,
                    result
                );

            } catch (error) {

                smartRegiResult.innerHTML = `
                    <div class="comparison-result">

                        <p>
                            スマレジCSVの確認に失敗しました。
                        </p>

                        <p class="comparison-note">
                            ${error.message}
                        </p>

                    </div>
                `;

                console.error(error);

            }

            smartRegiCsvInput.value = '';

        }
    );

}
