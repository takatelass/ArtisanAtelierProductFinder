/* ==========================================================
   CSV解析
========================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = '';

    let inQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"') {

            if (
                inQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;

            }

        } else if (
            char === ',' &&
            !inQuotes
        ) {

            row.push(value);

            value = '';

        } else if (
            (
                char === '\n' ||
                char === '\r'
            ) &&
            !inQuotes
        ) {

            if (
                char === '\r' &&
                next === '\n'
            ) {

                i++;

            }

            row.push(value);

            rows.push(row);

            row = [];

            value = '';

        } else {

            value += char;

        }

    }


    if (
        value !== '' ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    if (rows.length === 0) {

        return [];

    }


    const headers =
        rows[0].map(
            header =>
                header
                    .replace(/^\uFEFF/, '')
                    .trim()
        );


    return rows
        .slice(1)
        .filter(
            row =>
                row.some(
                    value =>
                        value.trim() !== ''
                )
        )
        .map(
            row => {

                const product = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {

                        product[header] =
                            row[index] ?? '';

                    }
                );


                return product;

            }
        );

}


/* ==========================================================
   共通処理
========================================================== */

function normalizeValue(value) {

    if (Array.isArray(value)) {

        return value.join('|');

    }


    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    return String(value).trim();

}


function getCSVValue(
    product,
    names
) {

    for (
        const name of names
    ) {

        if (
            Object.prototype.hasOwnProperty.call(
                product,
                name
            )
        ) {

            return product[name];

        }

    }


    return '';

}

}


/* ==========================================================
   更新用データ補助
========================================================== */

function normalizePrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return 0;

    }


    const normalized =
        String(value)
            .replace(/,/g, '')
            .replace(/円/g, '')
            .trim();


    const number =
        Number(normalized);


    return Number.isNaN(number)
        ? 0
        : number;

}


function splitCSVTags(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return [];

    }


    return String(value)
        .split('|')
        .map(
            tag => tag.trim()
        )
        .filter(Boolean);

}


function normalizeBoolean(value) {

    if (
        value === true ||
        value === 'true' ||
        value === 'TRUE' ||
        value === '1' ||
        value === 'はい' ||
        value === '○'
    ) {

        return true;

    }


    return false;

}


/* ==========================================================
   比較用正規化
========================================================== */

function normalizeComparisonValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    if (Array.isArray(value)) {

        return value
            .map(
                item =>
                    String(item).trim()
            )
            .filter(Boolean)
            .join('|');

    }


    let normalized =
        String(value).trim();


    if (
        normalized.toLowerCase() ===
        'true'
    ) {

        return 'true';

    }


    if (
        normalized.toLowerCase() ===
        'false'
    ) {

        return 'false';

    }


    normalized =
        normalized.replace(
            /,/g,
            ''
        );


    if (
        normalized !== '' &&
        !isNaN(normalized)
    ) {

        return String(
            Number(normalized)
        );

    }


    if (
        normalized.includes('|')
    ) {

        return normalized
            .split('|')
            .map(
                item =>
                    item.trim()
            )
            .filter(Boolean)
            .join('|');

    }


    if (
        normalized === '-' ||
        normalized === '—' ||
        normalized === 'ー'
    ) {

        return '';

    }


    return normalized;

}


/* ==========================================================
   CSVフィールド取得
========================================================== */

function getExistingCSVField(
    csv,
    names
) {

    for (
        const name of names
    ) {

        if (
            Object.prototype.hasOwnProperty.call(
                csv,
                name
            )
        ) {

            return {
                exists: true,
                value: csv[name]
            };

        }

    }


    return {
        exists: false,
        value: ''
    };

}

/* ==========================================================
   CSV安全チェック
========================================================== */

function validateCSVProducts(
    csvProducts
) {

    const errors = [];

    const codeMap = new Map();


    csvProducts.forEach(
        (product, index) => {

            const code =
                String(
                    product['品番'] ||
                    ''
                ).trim();


            if (!code) {

                errors.push(
                    `${index + 2}行目：品番が空欄です。`
                );

                return;

            }


            if (
                codeMap.has(code)
            ) {

                errors.push(
                    `品番「${code}」がCSV内で重複しています。`
                );

            } else {

                codeMap.set(
                    code,
                    true
                );

            }

        }
    );


    return errors;

}

/* ==========================================================
   更新データ作成
========================================================== */

function createUpdatedProducts() {

    if (
        currentProductsForUpdate.length === 0 ||
        csvProductsForUpdate.length === 0
    ) {

        throw new Error(
            '更新用の商品データが準備されていません。'
        );

    }


    const currentMap =
        new Map();


    currentProductsForUpdate.forEach(
        product => {

            const code =
                String(
                    product.code || ''
                ).trim();


            if (code) {

                currentMap.set(
                    code,
                    product
                );

            }

        }
    );


    return csvProductsForUpdate.map(
        csvProduct => {

            const code =
                String(
                    csvProduct['品番'] ||
                    ''
                ).trim();


            const currentProduct =
                currentMap.get(code);


            if (!currentProduct) {

                return convertCSVProductToJSON(
                    csvProduct
                );

            }


            return mergeCSVProduct(
                currentProduct,
                csvProduct
            );

        }
    );

}


/* ==========================================================
   比較
========================================================== */

function compareProducts(
    currentProducts,
    csvProducts
) {

    const currentMap =
        new Map();


    currentProducts.forEach(
        product => {

            const key =
                normalizeValue(
                    product.code
                );


            if (key) {

                currentMap.set(
                    key,
                    product
                );

            }

        }
    );


    const csvMap =
        new Map();


    csvProducts.forEach(
        product => {

            const key =
                createComparisonKey(
                    product
                );


            if (key) {

                csvMap.set(
                    key,
                    product
                );

            }

        }
    );


    let added = 0;

    let changed = 0;

    let deleted = 0;


    const changes = [];


    csvMap.forEach(
        (
            csvProduct,
            key
        ) => {

            if (
                !currentMap.has(key)
            ) {

                added++;

                return;

            }


            const currentProduct =
                currentMap.get(key);


            const comparison =
                hasProductChanged(
                    currentProduct,
                    csvProduct
                );


            if (
                comparison.changed
            ) {

                changed++;


                changes.push({

                    code: key,

                    field:
                        comparison.field,

                    current:
                        comparison.current,

                    csv:
                        comparison.csv

                });

            }

        }
    );


    currentMap.forEach(
        (
            product,
            key
        ) => {

            if (
                !csvMap.has(key)
            ) {

                deleted++;

            }

        }
    );


    return {

        added,

        changed,

        deleted,

        changes

    };

}


/* ==========================================================
   比較結果表示
========================================================== */

function showComparisonResult(
    currentProducts,
    csvProducts
) {

    const comparison =
        compareProducts(
            currentProducts,
            csvProducts
        );


    currentComparison =
        comparison;


    const validationErrors =
        validateCSVProducts(
            csvProducts
        );


    const dangerousDeletion =
        comparison.deleted > 0;


    const tooManyChanges =
        comparison.deleted >
            Math.max(
                10,
                Math.floor(
                    currentProducts.length *
                    0.05
                )
            );


    const canGenerate =
        validationErrors.length === 0 &&
        !dangerousDeletion &&
        !tooManyChanges;


    generateJsonButton.disabled =
        !canGenerate;


    comparisonStep.style.display =
        'block';


    updateActionStep.style.display =
        'block';


    let html = '';


    html += `

        <div class="comparison-summary">

            <div class="summary-card">

                <span>
                    現在の商品数
                </span>

                <strong>
                    ${currentProducts.length}件
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    CSVの商品数
                </span>

                <strong>
                    ${csvProducts.length}件
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    商品数の差
                </span>

                <strong>
                    ${csvProducts.length - currentProducts.length}件
                </strong>

            </div>

        </div>


        <div class="comparison-diff">

            <div class="summary-card">

                <span>
                    追加
                </span>

                <strong>
                    ${comparison.added}件
                </strong>

            </div>


            <div
                class="summary-card ${
                    comparison.changed > 0
                        ? 'warning'
                        : ''
                }">

                <span>
                    変更
                </span>

                <strong>
                    ${comparison.changed}件
                </strong>

            </div>


            <div
                class="summary-card ${
                    comparison.deleted > 0
                        ? 'danger'
                        : ''
                }">

                <span>
                    削除候補
                </span>

                <strong>
                    ${comparison.deleted}件
                </strong>

            </div>

        </div>

    `;


    /* ======================================================
       CSVエラー
    ======================================================= */

    if (
        validationErrors.length > 0
    ) {

        html += `

            <div class="update-warning">

                <strong>
                    ⚠ CSVに問題があります
                </strong>

                <ul class="validation-list">

                    ${validationErrors
                        .slice(0, 10)
                        .map(
                            error =>
                                `<li>${error}</li>`
                        )
                        .join('')
                    }

                </ul>

                ${
                    validationErrors.length > 10
                        ? '<p>その他にも問題があります。</p>'
                        : ''
                }

                <p>
                    内容を修正したCSVをもう一度選択してください。
                </p>

            </div>

        `;

    }


    /* ======================================================
       削除候補
    ======================================================= */

    if (
        dangerousDeletion
    ) {

        html += `

            <div class="update-warning">

                <strong>
                    ⚠ 削除候補があります
                </strong>

                <p>
                    現在の商品データには存在しますが、
                    今回のCSVには存在しない商品が
                    ${comparison.deleted}件あります。
                </p>

                <p>
                    安全のため、この状態では
                    商品データを更新できません。
                </p>

                <p>
                    CSVの内容を確認してください。
                </p>

            </div>

        `;

    }


    /* ======================================================
       大量削除
    ======================================================= */

    if (
        tooManyChanges &&
        !dangerousDeletion
    ) {

        html += `

            <div class="update-warning">

                <strong>
                    ⚠ 商品数の変化が大きすぎます
                </strong>

                <p>
                    CSVの商品数が現在の商品数から
                    大きく変化しています。
                </p>

                <p>
                    CSVの内容を確認してください。
                </p>

            </div>

        `;

    }


    /* ======================================================
       問題なし
    ======================================================= */

    if (
        validationErrors.length === 0 &&
        comparison.deleted === 0
    ) {

        html += `

            <div class="update-info">

                <strong>
                    ✓ 安全チェックOK
                </strong>

                <p>
                    品番の重複や削除候補はありません。
                </p>

                <p>
                    内容を確認して問題がなければ、
                    「商品データを更新」を押してください。
                </p>

            </div>

        `;

    }


    /* ======================================================
       変更内容
    ======================================================= */

    html += `

        <div
            class="comparison-diagnostic"
            style="margin-top:25px;">

            <p>
                <strong>
                    変更内容
                </strong>
            </p>

    `;


    if (
        comparison.changes.length === 0
    ) {

        html += `

            <p>
                現在の商品データとCSVの内容に
                変更はありません。
            </p>

        `;

    } else {

        const displayChanges =
            comparison.changes.slice(
                0,
                20
            );


        displayChanges.forEach(
            item => {

                html += `

                    <div class="change-detail">

                        <div class="change-code">
                            品番：${item.code}
                        </div>

                        <p>
                            変更項目：
                            <strong>
                                ${item.field}
                            </strong>
                        </p>

                        <p>
                            現在：
                            ${item.current || '（空欄）'}
                        </p>

                        <p>
                            更新後：
                            ${item.csv || '（空欄）'}
                        </p>

                    </div>

                `;

            }
        );


        if (
            comparison.changes.length > 20
        ) {

            html += `

                <p class="comparison-note">
                    ※変更内容は最初の20件を表示しています。
                    実際の更新対象は
                    ${comparison.changes.length}件です。
                </p>

            `;

        }

    }


    html += `

        </div>


        <p class="comparison-note">
            ※この段階では商品データは変更されていません。
        </p>

    `;


    uploadResult.innerHTML =
        html;

}

/* ==========================================================
   CSV読み込み
========================================================== */

csvFileInput.addEventListener(
    'change',
    async event => {

        const file =
            event.target.files &&
            event.target.files[0];


        if (!file) {

            return;

        }


        selectedFileName.textContent =
            `選択中：${file.name}`;


        comparisonStep.style.display =
            'block';


        updateActionStep.style.display =
            'none';


        generateJsonButton.disabled =
            true;


        uploadResult.innerHTML = `

            <div class="update-info">
                現在の商品データを確認しています……
            </div>

        `;


        try {

            const response =
                await fetch(
                    'products.json'
                );


            if (!response.ok) {

                throw new Error(
                    'products.jsonの読み込みに失敗しました。'
                );

            }


            const currentProducts =
                await response.json();


            uploadResult.innerHTML = `

                <div class="update-info">
                    CSVファイルを読み込んでいます……
                </div>

            `;


            const reader =
                new FileReader();


            reader.onload =
                loadEvent => {

                    try {

                        const text =
                            loadEvent.target.result;

                        csvTextForUpdate = text;

                        const csvProducts =
                            parseCSV(text);


                        if (
                            csvProducts.length === 0
                        ) {

                            uploadResult.innerHTML = `

                                <div class="update-warning">

                                    <strong>
                                        ⚠ CSVに商品データがありません
                                    </strong>

                                    <p>
                                        正しいCSVファイルを選択してください。
                                    </p>

                                </div>

                            `;

                            return;

                        }


                        currentProductsForUpdate =
                            currentProducts;


                        csvProductsForUpdate =
                            csvProducts;


                        showComparisonResult(
                            currentProducts,
                            csvProducts
                        );

                    } catch (error) {

                        uploadResult.innerHTML = `

                            <div class="update-warning">

                                <strong>
                                    ⚠ CSVの解析中にエラーが発生しました
                                </strong>

                                <p>
                                    CSVファイルの内容を確認してください。
                                </p>

                            </div>

                        `;

                        console.error(error);

                    }

                };


            reader.onerror =
                () => {

                    uploadResult.innerHTML = `

                        <div class="update-warning">

                            <strong>
                                ⚠ CSVファイルの読み込みに失敗しました
                            </strong>

                        </div>

                    `;

                };


            reader.readAsText(
                file,
                'UTF-8'
            );

        } catch (error) {

            uploadResult.innerHTML = `

                <div class="update-warning">

                    <strong>
                        ⚠ 現在の商品データを読み込めませんでした
                    </strong>

                    <p>
                        Product Finderのファイル構成を確認してください。
                    </p>

                </div>

            `;

            console.error(error);

        }


        csvFileInput.value = '';

    }
);


async function uploadCSVToGitHub() {

    if (!csvTextForUpdate) {

        throw new Error(
            'CSVデータが読み込まれていません。'
        );

    }


    const response =
        await fetch(
            GOOGLE_APPS_SCRIPT_URL,
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'text/plain;charset=utf-8'
                },

                body:
                    JSON.stringify({
                        csv:
                            csvTextForUpdate
                    })
            }
        );


    const result =
        await response.json();


    if (!result.success) {

        throw new Error(
            result.error ||
            'CSVのアップロードに失敗しました。'
        );

    }


    return result;

}
