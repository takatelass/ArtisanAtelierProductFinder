<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        商品データ更新 | Artisan Atelier Product Finder
    </title>

    <meta
        name="description"
        content="Artisan Atelier Product Finder 商品データ更新ページ">

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

<header>
    <div class="container">
        <h1>
            Artisan Atelier Product Finder
        </h1>
    </div>
</header>

<main class="container update-page">

    <section class="update-panel">

        <h2>
            商品データ更新
        </h2>

        <div class="update-file-area">

            <p class="update-file-label">
                アップロードするファイルを選択
            </p>

            <input
                type="file"
                id="csvFileInput"
                accept=".csv,text/csv"
                hidden>

            <button
                type="button"
                id="selectCsvButton"
                class="update-file-button">
                ファイルを選択
            </button>

        </div>

        <div
            id="uploadResult"
            class="upload-result"
            aria-live="polite">
        </div>

    </section>

    <a
        href="index.html"
        class="back-to-search">
        商品検索へ戻る
    </a>

</main>

<script>

const csvFileInput =
    document.getElementById('csvFileInput');

const selectCsvButton =
    document.getElementById('selectCsvButton');

const uploadResult =
    document.getElementById('uploadResult');


/* ==========================================================
   CSV解析
========================================================== */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {

            if (inQuotes && next === '"') {
                value += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }

        } else if (char === ',' && !inQuotes) {

            row.push(value);
            value = '';

        } else if (
            (char === '\n' || char === '\r') &&
            !inQuotes
        ) {

            if (char === '\r' && next === '\n') {
                i++;
            }

            row.push(value);
            rows.push(row);

            row = [];
            value = '';

        } else {

            value += char;

        }
    }

    if (value !== '' || row.length > 0) {
        row.push(value);
        rows.push(row);
    }

    if (rows.length === 0) {
        return [];
    }


    const headers =
        rows[0].map(header =>
            header
                .replace(/^\uFEFF/, '')
                .trim()
        );


    return rows
        .slice(1)
        .filter(row =>
            row.some(value =>
                value.trim() !== ''
            )
        )
        .map(row => {

            const product = {};

            headers.forEach(
                (header, index) => {
                    product[header] =
                        row[index] ?? '';
                }
            );

            return product;

        });

}


/* ==========================================================
   配列・文字列の比較用
========================================================== */

function normalizeValue(value) {

    if (Array.isArray(value)) {
        return value.join('|');
    }

    if (value === null || value === undefined) {
        return '';
    }

    return String(value)
        .trim();

}


/* ==========================================================
   CSV → Product Finderデータ比較用
========================================================== */

function getCSVValue(product, names) {

    for (const name of names) {

        if (
            Object.prototype.hasOwnProperty.call(
                product,
                name
            )
        ) {
            return product[name];
        }

    }

    return '';

}


function createComparisonKey(product) {

    return normalizeValue(
        getCSVValue(
            product,
            ['品番', 'code', '商品コード']
        )
    );

}


/* ==========================================================
   商品データの変更判定
========================================================== */

function normalizeComparisonValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    if (Array.isArray(value)) {

        return value
            .map(item =>
                String(item).trim()
            )
            .filter(Boolean)
            .join('|');

    }

    return String(value)
        .trim()
        .replace(/,/g, '');

}


function getExistingCSVField(
    csv,
    names
) {

    for (const name of names) {

        if (
            Object.prototype.hasOwnProperty.call(
                csv,
                name
            )
        ) {
            return {
                exists: true,
                value: csv[name]
            };
        }

    }

    return {
        exists: false,
        value: ''
    };

}


function valuesAreEqual(
    currentValue,
    csvValue
) {

    const current =
        normalizeComparisonValue(
            currentValue
        );

    const csv =
        normalizeComparisonValue(
            csvValue
        );

    return current === csv;

}


function hasProductChanged(
    current,
    csv
) {

    const fields = [

        {
            csv: ['メーカー'],
            json: 'maker'
        },

        {
            csv: ['品番', '商品コード'],
            json: 'code'
        },

        {
            csv: ['商品名', '名称'],
            json: 'name'
        },

        {
            csv: ['価格'],
            json: 'price'
        },

        {
            csv: ['ブランド'],
            json: 'brand'
        },

        {
            csv: ['カテゴリ'],
            json: 'category'
        },

        {
            csv: ['サブカテゴリ'],
            json: 'subCategory'
        },

        {
            csv: ['シリーズ'],
            json: 'series'
        },

        {
            csv: ['色'],
            json: 'color'
        },

        {
            csv: ['カラー系統'],
            json: 'colorGroup'
        },

        {
            csv: ['素材'],
            json: 'material'
        },

        {
            csv: ['サイズ'],
            json: 'size'
        },

        {
            csv: ['重量'],
            json: 'weight'
        },

        {
            csv: ['商品タイトル'],
            json: 'title'
        },

        {
            csv: ['画像URL', '画像URL '],
            json: 'image'
        },

        {
            csv: ['商品URL', '商品ページURL'],
            json: 'url'
        },

        {
            csv: ['特徴タグ'],
            json: 'tags'
        },

        {
            csv: ['用途タグ'],
            json: 'usageTags'
        },

        {
            csv: ['スペック1'],
            json: 'spec1'
        },

        {
            csv: ['スペック2'],
            json: 'spec2'
        },

        {
            csv: ['スペック3'],
            json: 'spec3'
        },

        {
            csv: ['スペック4'],
            json: 'spec4'
        },

        {
            csv: ['スペック5'],
            json: 'spec5'
        },

        {
            csv: ['ケア方法'],
            json: 'care'
        },

        {
            csv: ['備考①'],
            json: 'note1'
        },

        {
            csv: ['備考②'],
            json: 'note2'
        },

        {
            csv: ['おすすめ'],
            json: 'recommended'
        },

        {
            csv: ['新商品'],
            json: 'isNew'
        },

        {
            csv: ['人気商品'],
            json: 'popular'
        },

        {
            csv: ['公開'],
            json: 'published'
        },

        {
            csv: ['店舗在庫'],
            json: 'stock'

        }

    ];


    for (const field of fields) {

        const csvField =
            getExistingCSVField(
                csv,
                field.csv
            );


        /*
         * CSV側にその列が存在しない場合は
         * 比較しない
         */
        if (!csvField.exists) {
            continue;
        }


        if (
            !valuesAreEqual(
                current[field.json],
                csvField.value
            )
        ) {

            return true;

        }

    }


    return false;

}


/* ==========================================================
   比較結果表示
========================================================== */

function showComparisonResult(
    currentProducts,
    csvProducts
) {

    const currentMap =
        new Map();

    currentProducts.forEach(
        product => {

            const key =
                normalizeValue(
                    product.code
                );

            if (key) {
                currentMap.set(
                    key,
                    product
                );
            }

        }
    );


    const csvMap =
        new Map();

    csvProducts.forEach(
        product => {

            const key =
                createComparisonKey(
                    product
                );

            if (key) {
                csvMap.set(
                    key,
                    product
                );
            }

        }
    );


    let added = 0;
    let changed = 0;
    let deleted = 0;


    csvMap.forEach(
        (csvProduct, key) => {

            if (!currentMap.has(key)) {

                added++;

            } else {

                const currentProduct =
                    currentMap.get(key);

                if (
                    hasProductChanged(
                        currentProduct,
                        csvProduct
                    )
                ) {
                    changed++;
                }

            }

        }
    );


    currentMap.forEach(
        (product, key) => {

            if (!csvMap.has(key)) {
                deleted++;
            }

        }
    );


    uploadResult.innerHTML = `

        <div class="comparison-result">

            <p>
                CSVファイルを確認しました。
            </p>

            <div class="comparison-summary">

                <div>
                    <span>現在の商品数</span>
                    <strong>
                        ${currentProducts.length}件
                    </strong>
                </div>

                <div>
                    <span>CSVの商品数</span>
                    <strong>
                        ${csvProducts.length}件
                    </strong>
                </div>

            </div>

            <div class="comparison-diff">

                <div>
                    <span>追加</span>
                    <strong>
                        ${added}件
                    </strong>
                </div>

                <div>
                    <span>変更</span>
                    <strong>
                        ${changed}件
                    </strong>
                </div>

                <div>
                    <span>削除候補</span>
                    <strong>
                        ${deleted}件
                    </strong>
                </div>

            </div>

            <p class="comparison-note">
                ※この段階では商品データは変更されていません。
            </p>

        </div>

    `;

}


/* ==========================================================
   CSV選択
========================================================== */

selectCsvButton.addEventListener(
    'click',
    () => {

        csvFileInput.click();

    }
);


/* ==========================================================
   CSV読み込み
========================================================== */

csvFileInput.addEventListener(
    'change',
    async (event) => {

        const file =
            event.target.files &&
            event.target.files[0];

        if (!file) {
            return;
        }


        uploadResult.textContent =
            '現在の商品データを確認しています……';


        try {

            const response =
                await fetch('products.json');


            if (!response.ok) {
                throw new Error(
                    'products.jsonの読み込みに失敗しました。'
                );
            }


            const currentProducts =
                await response.json();


            uploadResult.textContent =
                'CSVファイルを読み込んでいます……';


            const reader =
                new FileReader();


            reader.onload =
                (loadEvent) => {

                    try {

                        const text =
                            loadEvent.target.result;


                        const csvProducts =
                            parseCSV(text);


                        if (
                            csvProducts.length === 0
                        ) {

                            uploadResult.textContent =
                                'CSVに商品データがありません。';

                            return;

                        }


                        showComparisonResult(
                            currentProducts,
                            csvProducts
                        );

                    } catch (error) {

                        uploadResult.textContent =
                            'CSVの解析中にエラーが発生しました。';

                        console.error(error);

                    }

                };


            reader.onerror =
                () => {

                    uploadResult.textContent =
                        'CSVファイルの読み込みに失敗しました。';

                };


            reader.readAsText(
                file,
                'UTF-8'
            );


        } catch (error) {

            uploadResult.textContent =
                '現在の商品データを読み込めませんでした。';

            console.error(error);

        }


        csvFileInput.value = '';

    }
);

</script>

</body>

</html>
